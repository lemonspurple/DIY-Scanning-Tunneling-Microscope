name: Build STM_GUI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Python Setup
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: patchelf installieren (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: sudo apt-get install -y patchelf

    - name: Dependencies installieren
      run: pip install nuitka -r Software/tkinter-usb-app/requirements.txt

    - name: Binary bauen
      working-directory: Software/tkinter-usb-app/src
      shell: bash
      run: |
        python -m nuitka --onefile \
          --assume-yes-for-downloads \
          --include-package=gui \
          --include-data-dir=assets=assets \
          --include-data-files=config.ini=config.ini \
          --output-filename=STM_GUI \
          main.py

    - name: Binary hochladen
      uses: actions/upload-artifact@v4
      with:
        name: "STM_GUI-${{ matrix.os }}"
        path: |
          Software/tkinter-usb-app/src/STM_GUI
          Software/tkinter-usb-app/src/STM_GUI.exe
        if-no-files-found: error
